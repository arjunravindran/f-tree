<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relationship path</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  :root{--bg:#F7F4EE;--card:#ffffff;--border:#E7E1D6;--ink:#21201C;--muted:#6B6558;--sage:#5C7A5E;--accent:#BC5B39;}
  body{margin:0;font-family:'Work Sans',system-ui,sans-serif;color:var(--ink);background:#ddd4c2;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  a{color:var(--ink);text-decoration:none;}
  h1,h2{font-family:'Fraunces',serif;margin:0;}
  button{font-family:'Work Sans',system-ui,sans-serif;}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);">

  <header style="display: flex; align-items: center; gap: 12px; padding: 22px 24px 16px; border-bottom: 1px solid var(--border);">
    <a href="contacts.html" aria-label="Back to family network" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#21201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div>
      <h1 style="font-size: 20px; font-weight: 600; line-height: 1.1;">You &amp; Devika</h1>
      <div style="font-size: 13px; color: var(--muted); margin-top: 3px;">Relationship</div>
    </div>
  </header>

  <div style="flex-grow: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 22px;">

    <div style="background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px 18px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Fraunces',serif; font-weight: 600; font-size: 17px; flex-shrink: 0;">Y</div>
        <div style="width: 18px; height: 2px; background: var(--border);"></div>
        <div style="width: 32px; height: 32px; border-radius: 50%; background: #9C7A3E; display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Fraunces',serif; font-weight: 600; font-size: 13px; flex-shrink: 0; opacity: 0.85;">A</div>
        <div style="width: 18px; height: 2px; background: var(--border);"></div>
        <div style="width: 32px; height: 32px; border-radius: 50%; background: #3F6C82; display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Fraunces',serif; font-weight: 600; font-size: 13px; flex-shrink: 0; opacity: 0.85;">S</div>
        <div style="width: 18px; height: 2px; background: var(--border);"></div>
        <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--sage); display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Fraunces',serif; font-weight: 600; font-size: 17px; flex-shrink: 0;">D</div>
      </div>
      <div style="text-align: center;">
        <div style="font-family: 'Fraunces',serif; font-size: 18px; font-weight: 600;">2nd cousin</div>
        <div style="font-size: 13px; color: var(--muted); margin-top: 5px;">You &rarr; your mother &rarr; her sister &rarr; Devika</div>
      </div>
    </div>

    <div style="background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; gap: 14px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 21s7-7.5 7-12a7 7 0 10-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
      <div style="flex-grow: 1;">
        <div style="font-size: 13px; color: var(--muted);">How far apart</div>
        <div style="font-family: 'Fraunces',serif; font-size: 23px; font-weight: 600; margin-top: 2px;">1,742 mi</div>
      </div>
    </div>

    <div>
      <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 10px;">Fun facts</h2>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px; font-size: 14px;">Same birth month &mdash; both born in March</div>
        <div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px; font-size: 14px;">14 years apart</div>
        <div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px; font-size: 14px;">Both born in Chennai</div>
      </div>
    </div>

  </div>

  <div style="padding: 16px 24px 26px; border-top: 1px solid var(--border); display: flex; gap: 12px;">
    <button style="flex-grow: 1; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 14px; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      Message Devika
    </button>
    <a href="tree.html" style="border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 14px 18px; font-weight: 600; font-size: 15px; text-align: center;">Tree</a>
  </div>

</div>
</body>
</html>
