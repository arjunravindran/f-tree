<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pair with a relative</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  :root{--bg:#F7F4EE;--card:#ffffff;--border:#E7E1D6;--ink:#21201C;--muted:#6B6558;--sage:#5C7A5E;--accent:#BC5B39;}
  body{margin:0;font-family:'Work Sans',system-ui,sans-serif;color:var(--ink);background:#ddd4c2;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  a{color:var(--ink);text-decoration:none;}
  h1,h2{font-family:'Fraunces',serif;margin:0;}
  button{font-family:'Work Sans',system-ui,sans-serif;}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);">

  <header style="display: flex; align-items: center; gap: 12px; padding: 22px 24px 16px; border-bottom: 1px solid var(--border);">
    <a href="contacts.html" aria-label="Cancel" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#21201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </a>
    <h1 style="font-size: 19px; font-weight: 600;">Pair with a relative</h1>
  </header>

  <div style="flex-grow: 1; padding: 32px 28px; display: flex; flex-direction: column; align-items: center; gap: 28px;">

    <div style="display: flex; align-items: center; justify-content: center; margin-top: 8px;">
      <div style="width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Fraunces',serif; font-weight: 600; font-size: 17px; margin-right: -12px; border: 3px solid var(--bg);">Y</div>
      <div style="width: 46px; height: 46px; border-radius: 50%; background: var(--sage); display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Fraunces',serif; font-weight: 600; font-size: 17px; border: 3px solid var(--bg);">?</div>
    </div>

    <div style="text-align: center;">
      <div style="font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px;">Your pairing code</div>
      <div style="font-family: 'Fraunces',serif; font-size: 40px; font-weight: 600; letter-spacing: 0.05em;">482 916</div>
    </div>

    <div style="width: 160px; height: 160px; background: #fff; border: 1px solid var(--border); border-radius: 16px; position: relative; flex-shrink: 0;">
      <div style="position: absolute; top: 12px; left: 12px; width: 26px; height: 26px; background: var(--ink);"></div>
      <div style="position: absolute; top: 18px; left: 18px; width: 14px; height: 14px; background: #fff;"></div>
      <div style="position: absolute; top: 22px; left: 22px; width: 6px; height: 6px; background: var(--ink);"></div>

      <div style="position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; background: var(--ink);"></div>
      <div style="position: absolute; top: 18px; right: 18px; width: 14px; height: 14px; background: #fff;"></div>
      <div style="position: absolute; top: 22px; right: 22px; width: 6px; height: 6px; background: var(--ink);"></div>

      <div style="position: absolute; bottom: 12px; left: 12px; width: 26px; height: 26px; background: var(--ink);"></div>
      <div style="position: absolute; bottom: 18px; left: 18px; width: 14px; height: 14px; background: #fff;"></div>
      <div style="position: absolute; bottom: 22px; left: 22px; width: 6px; height: 6px; background: var(--ink);"></div>

      <div style="position: absolute; top: 48px; left: 56px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 48px; left: 70px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 60px; left: 48px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 60px; left: 90px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 74px; left: 62px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 74px; left: 100px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 88px; left: 50px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 88px; left: 78px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 100px; left: 96px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 112px; left: 60px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 112px; left: 84px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 126px; left: 46px; width: 6px; height: 6px; background: var(--ink);"></div>
      <div style="position: absolute; top: 126px; left: 106px; width: 6px; height: 6px; background: var(--ink);"></div>
    </div>

    <div style="font-size: 13px; color: var(--muted); text-align: center;">Ask them to scan this, or type in the code above</div>

    <a href="contacts.html" style="width: 100%; box-sizing: border-box; text-align: center; border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 14px; font-weight: 600; font-size: 15px;">Scan their code instead</a>

  </div>

  <div style="padding: 0 28px 26px; text-align: center;">
    <div style="font-size: 12px; color: var(--muted); font-style: italic; line-height: 1.5;">This happens once, in person. After that you're connected everywhere &mdash; even after a lost phone, any relative here can restore you.</div>
  </div>

</div>
</body>
</html>
