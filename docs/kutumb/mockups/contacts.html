<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family network</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  :root{--bg:#F7F4EE;--card:#ffffff;--border:#E7E1D6;--ink:#21201C;--muted:#6B6558;--sage:#5C7A5E;--accent:#BC5B39;}
  body{margin:0;font-family:'Work Sans',system-ui,sans-serif;color:var(--ink);background:#ddd4c2;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  a{color:var(--ink);text-decoration:none;}
  h1,h2{font-family:'Fraunces',serif;margin:0;}
  button{font-family:'Work Sans',system-ui,sans-serif;}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 18px; border-bottom: 1px solid var(--border);">
    <h1 style="font-size: 20px; font-weight: 600;">Family network</h1>
    <a href="pairing.html" aria-label="Pair with someone nearby" style="width: 36px; height: 36px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </header>

  <div style="flex-grow: 1; overflow-y: auto; padding: 18px 24px; display: flex; flex-direction: column; gap: 10px;">

    <a href="main.html" style="background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 42px; height: 42px; border-radius: 50%; background: var(--sage); display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Fraunces',serif; font-weight: 600; font-size: 15px; flex-shrink: 0;">D</div>
      <div style="flex-grow: 1;">
        <div style="font-size: 15px; font-weight: 600;">Devika</div>
        <div style="font-size: 12px; color: var(--muted); margin-top: 2px;">2nd cousin</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 6px;">
          <div style="width: 7px; height: 7px; border-radius: 50%; background: var(--sage);"></div>
          <div style="font-size: 12px; color: var(--sage); font-weight: 600;">Paired in person</div>
        </div>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 10px; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      </div>
    </a>

    <div style="background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 42px; height: 42px; border-radius: 50%; background: #9C7A3E; display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Fraunces',serif; font-weight: 600; font-size: 15px; flex-shrink: 0;">A</div>
      <div style="flex-grow: 1;">
        <div style="font-size: 15px; font-weight: 600;">Asha</div>
        <div style="font-size: 12px; color: var(--muted); margin-top: 2px;">Aunt</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 6px;">
          <div style="width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); box-sizing: border-box;"></div>
          <div style="font-size: 12px; color: var(--muted); font-weight: 600;">Vouched by Devika</div>
        </div>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;" title="Meet in person to unlock messaging">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B9B2A2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 118 0v4"/></svg>
      </div>
    </div>

    <div style="background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 42px; height: 42px; border-radius: 50%; background: #3F6C82; display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Fraunces',serif; font-weight: 600; font-size: 15px; flex-shrink: 0;">K</div>
      <div style="flex-grow: 1;">
        <div style="font-size: 15px; font-weight: 600;">Kiran</div>
        <div style="font-size: 12px; color: var(--muted); margin-top: 2px;">Cousin</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 6px;">
          <div style="width: 7px; height: 7px; border-radius: 50%; background: var(--sage);"></div>
          <div style="font-size: 12px; color: var(--sage); font-weight: 600;">Paired in person</div>
        </div>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 10px; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      </div>
    </div>

    <div style="font-size: 12px; color: var(--muted); text-align: center; padding: 10px 8px 4px; line-height: 1.5;">Vouched contacts unlock messaging once you meet them in person.</div>

  </div>

</div>
</body>
</html>
