name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs cmdline-tools and accepts the SDK licences. The platform itself is left to
      # AGP: platform 37 uses the new SDK minor-version id (`platforms;android-37.0`), which the
      # runner's bundled cmdline-tools is too old to resolve.
      - uses: android-actions/setup-android@v3
        with:
          # The action's default is "tools platform-tools". The runner image's cmdline-tools 16.0
          # no longer carries the long-retired "tools" package, so asking for it fails the whole
          # step. AGP installs the platform and build-tools it needs on its own.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # CrossLanguageTransferTest runs the Kotlin against desktop/nearby/ in a real node process.
      # It skips where node is missing, which on a laptop is right and here would be the test
      # passing by not running -- so here a missing node is a failure (FTREE_REQUIRE_NODE below).
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Unit tests
        env: { FTREE_REQUIRE_NODE: '1' }
        run: ./gradlew testDebugUnitTest :kutumb-core:test

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
          retention-days: 7
