name: Android CI

# Turnkey validation for every push/PR. Drop this file into the fork's
# .github/workflows/ directory (already in the right place if you unzip
# this handoff into the repo root). Adjust module paths if f-tree's
# Gradle module layout differs from assumptions below.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  static-checks:
    name: Unit tests, lint, static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Pure-function core (kinship rules, chart layout, duplicate
      # matching, and the new trust/recovery/game logic) should all be
      # covered here — these run on the JVM, no emulator needed.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :kutumb-core:test

      - name: Android Lint
        run: ./gradlew lintDebug

      # Add a detekt/ktlint block here once a config file is chosen —
      # f-tree doesn't ship one yet, so this is left as a TODO rather
      # than guessed at.
      # - name: Static analysis (detekt)
      #   run: ./gradlew detekt

      - name: Assemble debug build
        run: ./gradlew assembleDebug

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  instrumented-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Covers the two flows that are genuinely hard to unit-test:
      # the pairing handshake screen state and the facts
      # resolution/scoring UI. Wi-Fi Direct itself and real Nostr relay
      # delivery can't be exercised by a single emulator in CI — see
      # the manual two-device checklist in README.md.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: '**/build/reports/androidTests/'
